<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
  <defs>
    <linearGradient id="borderStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8957e5;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3ecf8e;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="shadowStats">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8957e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="2" y="2" width="436" height="196" rx="16" ry="16" fill="none" stroke="url(#borderStats)" stroke-width="2" filter="url(#shadowStats)"/>
  <rect x="4" y="4" width="432" height="192" rx="14" ry="14" fill="#0d1117" fill-opacity="0.88"/>
  <rect x="4" y="4" width="432" height="192" rx="14" ry="14" fill="#1a1b27" fill-opacity="0.45"/>
  
  <!-- Header -->
  <rect x="20" y="18" width="4" height="26" rx="2" fill="#8957e5"/>
  <text x="32" y="34" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">⚡ GitHub Activity &amp; Overview</text>
  <text x="32" y="50" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#8b949e">REAL-TIME TELEMETRY &amp; REPOSITORY METRICS</text>
  
  <line x1="20" y1="60" x2="420" y2="60" stroke="#30363d" stroke-width="1"/>
  
  <!-- 3 Metric Pillars -->
  <!-- Col 1: Contributions -->
  <rect x="20" y="70" width="124" height="74" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="82" y="98" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#388bfd" text-anchor="middle">80+</text>
  <text x="82" y="118" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#8b949e" text-anchor="middle">CONTRIBUTIONS</text>
  <text x="82" y="132" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">Year 2026</text>

  <!-- Col 2: Production Projects -->
  <rect x="156" y="70" width="124" height="74" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="218" y="98" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#3fb950" text-anchor="middle">4</text>
  <text x="218" y="118" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#8b949e" text-anchor="middle">FLAGSHIP SYSTEMS</text>
  <text x="218" y="132" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">D2C &amp; Analytics</text>

  <!-- Col 3: Repositories -->
  <rect x="292" y="70" width="124" height="74" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="354" y="98" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="24" font-weight="800" fill="#bc8cff" text-anchor="middle">100%</text>
  <text x="354" y="118" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#8b949e" text-anchor="middle">VERIFIED CODE</text>
  <text x="354" y="132" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="9" fill="#bc8cff" text-anchor="middle">Next.js &amp; Python</text>

  <!-- Bottom status row -->
  <circle cx="28" cy="170" r="4" fill="#3fb950"/>
  <text x="40" y="174" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#c9d1d9">Active Contributor &amp; Open Source Builder</text>
  <text x="410" y="174" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" fill="#58a6ff" text-anchor="end">@sugan0025</text>
</svg>
