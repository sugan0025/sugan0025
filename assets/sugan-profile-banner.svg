<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Suganesan S</title>
  <desc id="description">A warm ivory wordmark on charcoal beside a copper orbital illustration.</desc>
  <defs>
    <linearGradient id="background" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop stop-color="#181a1c"/>
      <stop offset="1" stop-color="#111213"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ba7648" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ba7648" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop stop-color="#f9d4aa"/>
      <stop offset="1" stop-color="#a45d3d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24V0H24" fill="none" stroke="#f4d5b6" stroke-opacity=".09"/>
    </pattern>
    <linearGradient id="fade" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-fade"><rect x="510" width="450" height="300" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="298" rx="19"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="300" fill="url(#background)"/>
    <ellipse cx="773" cy="151" rx="262" ry="220" fill="url(#glow)"/>
    <rect x="510" width="450" height="300" fill="url(#grid)" mask="url(#grid-fade)"/>
    <g transform="translate(770 150)" fill="none">
      <circle r="99" stroke="#ecd0ad" stroke-opacity=".2"/>
      <circle r="120" stroke="#ecd0ad" stroke-opacity=".17" stroke-dasharray="2 7"/>
      <circle r="78" fill="#151515" stroke="url(#copper)" stroke-opacity=".66"/>
      <ellipse rx="131" ry="37" transform="rotate(-34)" stroke="url(#copper)" stroke-width="1.7"/>
      <path d="M-48 24-21 2 0 13 42-30M24-30h18v18" stroke="#f2c49e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-41 36h82" stroke="#f2c49e" stroke-opacity=".27"/>
      <circle cx="-48" cy="24" r="4" fill="#f2c49e"/>
      <circle cx="56" cy="-62" r="5" fill="#f2c49e" stroke="#1b1715" stroke-width="2"/>
      <circle cx="-96" cy="60" r="4" fill="#d58f65"/>
    </g>
    <path d="M56 94h36" stroke="#e5a67b" stroke-width="2"/>
    <text x="56" y="162" fill="#fff4e8" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="-1.6">Suganesan S</text>
    <text x="59" y="208" fill="#e8b995" font-family="Arial, sans-serif" font-size="23">Business analytics &amp; software development</text>
  </g>
  <rect x="1" y="1" width="958" height="298" rx="19" fill="none" stroke="#b88763" stroke-opacity=".56"/>
</svg>
