<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220">
  <defs>
    <linearGradient id="border-ose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.95"/>
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="shadow-ose">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer glow border -->
  <rect x="2" y="2" width="436" height="216" rx="16" ry="16" fill="none" stroke="url(#border-ose)" stroke-width="2" filter="url(#shadow-ose)"/>
  <!-- Glass background -->
  <rect x="4" y="4" width="432" height="212" rx="14" ry="14" fill="#0d1117" fill-opacity="0.88"/>
  <!-- Inner frosted layer -->
  <rect x="4" y="4" width="432" height="212" rx="14" ry="14" fill="#0f172a" fill-opacity="0.45"/>
  <!-- Accent line -->
  <rect x="24" y="24" width="4" height="40" rx="2" fill="#10B981"/>
  <!-- Title -->
  <text x="40" y="42" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">🏛️🌾  One Smart Era</text>
  <text x="40" y="62" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">SMART CITY CIVIC GRIEVANCES &amp; KISAN AGRO PLATFORM</text>
  <!-- Divider -->
  <line x1="24" y1="78" x2="416" y2="78" stroke="#10B981" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Description -->
  <text x="24" y="100" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">3-in-1 Flutter platform for Citizens, Farmers, and City Officials</text>
  <text x="24" y="118" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#c9d1d9">with AI crop pathology, APMC price waves, and SLA triage.</text>
  <!-- Tech pills -->
  <rect x="24" y="138" width="68" height="22" rx="11" fill="#10B981" fill-opacity="0.18"/>
  <text x="34" y="153" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#34D399">Flutter 3</text>
  <rect x="100" y="138" width="76" height="22" rx="11" fill="#0EA5E9" fill-opacity="0.18"/>
  <text x="110" y="153" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Firebase</text>
  <rect x="184" y="138" width="88" height="22" rx="11" fill="#F59E0B" fill-opacity="0.18"/>
  <text x="194" y="153" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#FBBF24">AI Doctor</text>
  <rect x="280" y="138" width="70" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.18"/>
  <text x="290" y="153" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#A78BFA">OSM Map</text>
  <rect x="358" y="138" width="60" height="22" rx="11" fill="#EF4444" fill-opacity="0.18"/>
  <text x="368" y="153" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" fill="#F87171">SHA-256</text>
