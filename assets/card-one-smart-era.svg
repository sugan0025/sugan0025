  <text x="24" y="186" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#8b949e">🛡️ SHA-256 Hashing  •  📈 60fps Charts  •  🌾 Mandi Tickers</text>
  <text x="24" y="204" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#38BDF8">▶ github.com/sugan0025/one-smart-era</text>
